name: Ingestion FirstCycling

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la minute 17
  workflow_dispatch:        # déclenchement manuel

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests pandas beautifulsoup4 lxml slumber python-dateutil pytz soupsieve

      - name: Récupérer la librairie FirstCycling
        run: |
          git clone --depth 1 https://github.com/baronet2/FirstCyclingAPI.git fca_src
          cp -r fca_src/first_cycling_api ingestion/first_cycling_api

      - name: Lancer l'ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingestion/ingest.py
