name: Ingestion PCS

# Quand le script tourne :
#  - automatiquement, toutes les heures (utile en période de course)
#  - manuellement, via le bouton "Run workflow" dans l'onglet Actions
on:
  schedule:
    - cron: "17 * * * *"   # à la minute 17 de chaque heure
  workflow_dispatch:        # déclenchement manuel

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install procyclingstats cloudscraper requests

      - name: Lancer l'ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingestion/ingest.py
